<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111315">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Kitchen Inventory">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src 'self' https://api.github.com; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:;">
<title>Kitchen Inventory</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", sans-serif;
    background: #111315;
    color: #f2f3f5;
  }
  .app {
    max-width: 760px; margin: 0 auto;
    padding: max(20px, env(safe-area-inset-top)) 16px max(40px, env(safe-area-inset-bottom));
  }
  h1 { font-size: 30px; margin: 4px 0 16px; letter-spacing: -0.6px; }
  .tabs {
    display: flex; flex-wrap: nowrap; gap: 8px; margin-bottom: 18px;
    border-bottom: 1px solid #30343a; padding-bottom: 8px;
    overflow-x: auto; scrollbar-width: none; -webkit-overflow-scrolling: touch;
  }
  .tabs::-webkit-scrollbar { display: none; }
  .tab {
    flex: 0 0 auto;
    border: 0; background: transparent; padding: 10px 14px;
    border-radius: 10px; font-size: 16px; font-weight: 600; color: #a9afb8;
    cursor: pointer; white-space: nowrap;
  }
  .tab.active { background: #2a2e34; color: #f5f6f7; }
  .tab-icon { color: #7fb8e6; margin-right: 5px; }
  .summary {
    background: #1b1e22; border: 1px solid #30343a; border-radius: 16px;
    padding: 15px 16px; margin-bottom: 22px;
  }
  .summary-title { font-weight: 700; font-size: 16px; }
  .summary-main { font-size: 22px; font-weight: 700; margin-top: 3px; }
  .summary-sub { color: #a9afb8; margin-top: 2px; font-size: 14px; }
  .category { margin: 0 0 24px; }
  .category-head {
    display:flex; align-items:center; justify-content:space-between;
    padding: 5px 2px 9px; border-bottom: 1px solid #30343a; cursor: pointer;
  }
  .category-head h2 { font-size: 15px; margin:0; letter-spacing:.5px; }
  .chevron { color:#8f969f; font-size:16px; }
  .item {
    display:flex; align-items:center; gap:6px; min-height:40px;
    border-bottom:1px solid #30343a; padding:3px 6px;
    border-radius:7px;
  }
  .item:nth-of-type(even) { background:#181b1f; }
  .move-up {
    flex:0 0 36px; width:36px; height:36px; border-radius:10px; border:1px solid #4a5058;
    background:#24282e; color:#ffffff; font-size:16px; line-height:1; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    -webkit-tap-highlight-color: transparent;
  }
  .move-up:disabled { opacity:.35; cursor:default; }
  .move-up:active { transform: scale(.94); background:#343941; }
  .item-name { flex:1 1 auto; min-width:0; font-size:18px; line-height:1.25; overflow-wrap:anywhere; }
  .controls { display:flex; align-items:center; gap:4px; flex:0 0 auto; }
  .qty {
    min-width:24px; text-align:center; font-size:17px; font-weight:700;
    transition: transform .14s ease, background .14s ease;
    border-radius:8px; padding:3px 1px;
  }
  .qty.flash { transform: scale(1.28); background:#30343a; }
  button { font: inherit; touch-action: manipulation; }
  .round {
    width:36px; height:36px; border-radius:10px; border:1px solid #4a5058;
    background:#24282e; color:#ffffff; font-size:21px; line-height:1; cursor:pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .round:disabled { opacity:.35; cursor:default; }
  .round:active { transform: scale(.94); background:#343941; }
  .add-btn {
    width:100%; border:1px dashed #59616b; background:transparent; color:#d9dde2;
    border-radius:12px; padding:12px; margin-top:10px; font-size:16px;
    cursor:pointer;
  }
  .add-panel {
    display:none; background:#24282e; border:1px solid #ddd; border-radius:14px;
    padding:14px; margin-top:10px;
  }
  .add-panel.open { display:block; }
  .search {
    width:100%; border:1px solid #4b535d; border-radius:10px; padding:11px 12px;
    font-size:16px; outline:none; color:#f2f3f5; background:#24282e;
  }
  .suggestions { margin-top:8px; max-height:180px; overflow:auto; }
  .suggestion {
    width:100%; text-align:left; border:0; background:#292d33; color:#f0f2f4; margin:4px 0;
    border-radius:9px; padding:10px; cursor:pointer;
  }
  .new-item-row { margin-top:12px; }
  .new-label { font-size:13px; color:#a9afb8; margin-bottom:5px; }
  .quantity-row { display:flex; align-items:center; justify-content:space-between; margin-top:12px; }
  .add-action {
    border:0; border-radius:10px; background:#e7e9ec; color:#15171a;
    padding:11px 16px; cursor:pointer; font-weight:700;
  }
  .empty { color:#8f969f; font-size:14px; padding:14px 2px 0; }
  .hidden { display:none; }

  .header-row {
    display:flex; align-items:center; justify-content:space-between; gap:10px;
  }
  .header-row h1 { flex:1 1 auto; min-width:0; }
  .sync-pill {
    flex:0 0 auto; display:flex; align-items:center; gap:6px;
    border:1px solid #4a5058; background:#1b1e22; color:#d9dde2;
    border-radius:999px; padding:7px 12px; font-size:13px; font-weight:600;
    cursor:pointer; -webkit-tap-highlight-color: transparent;
  }
  .sync-pill:active { transform: scale(.96); }
  .sync-dot { width:8px; height:8px; border-radius:50%; background:#8f969f; flex:0 0 auto; }
  .sync-pill[data-state="synced"] .sync-dot { background:#3ddc7a; }
  .sync-pill[data-state="syncing"] .sync-dot { background:#4a9eff; animation: pulse 1s ease-in-out infinite; }
  .sync-pill[data-state="offline"] .sync-dot { background:#e6b545; }
  .sync-pill[data-state="conflict"] .sync-dot,
  .sync-pill[data-state="error"] .sync-dot { background:#e6534a; }
  @keyframes pulse { 0%,100% { opacity:1; } 50% { opacity:.35; } }

  .banner {
    background:#241c14; border:1px solid #5a4324; border-radius:14px;
    padding:14px 16px; margin-bottom:20px; font-size:14px; line-height:1.4;
  }
  .banner.error { background:#241414; border-color:#5a2424; }
  .banner-title { font-weight:700; margin-bottom:4px; }
  .banner-actions { display:flex; gap:8px; margin-top:12px; flex-wrap:wrap; }
  .banner-actions button {
    border:1px solid #59616b; background:#24282e; color:#f2f3f5;
    border-radius:10px; padding:9px 14px; font-size:14px; font-weight:600; cursor:pointer;
  }
  .banner-actions button.primary { background:#e7e9ec; color:#15171a; border-color:#e7e9ec; }

  .modal-overlay {
    position:fixed; inset:0; background:rgba(0,0,0,.55);
    display:flex; align-items:flex-end; justify-content:center; z-index:50;
  }
  .modal-overlay.hidden { display:none; }
  @media (min-width:520px) { .modal-overlay { align-items:center; } }
  .modal {
    background:#1b1e22; border:1px solid #30343a; border-radius:18px 18px 0 0;
    width:100%; max-width:460px; max-height:88vh; overflow:auto;
    padding:20px 18px 24px;
  }
  @media (min-width:520px) { .modal { border-radius:18px; } }
  .modal h2 { font-size:19px; margin:0 0 4px; }
  .modal p.hint { color:#a9afb8; font-size:13px; margin:0 0 16px; line-height:1.4; }
  .field { margin-bottom:12px; }
  .field label { display:block; font-size:13px; color:#a9afb8; margin-bottom:5px; }
  .field input {
    width:100%; border:1px solid #4b535d; border-radius:10px; padding:11px 12px;
    font-size:16px; outline:none; color:#f2f3f5; background:#24282e;
  }
  .modal-status { font-size:13px; margin:10px 0 4px; min-height:18px; }
  .modal-status.ok { color:#3ddc7a; }
  .modal-status.err { color:#e6534a; }
  .modal-actions { display:flex; gap:8px; margin-top:16px; }
  .modal-actions button {
    flex:1 1 auto; border:0; border-radius:10px; padding:12px; font-size:15px;
    font-weight:700; cursor:pointer;
  }
  .modal-actions .btn-save { background:#e7e9ec; color:#15171a; }
  .modal-actions .btn-cancel { background:#2a2e34; color:#d9dde2; }
  .modal-actions .btn-danger { background:transparent; color:#e6534a; border:1px solid #5a2424; flex:0 0 auto; }
  .build-info { color:#5a616b; font-size:11px; margin-top:14px; text-align:center; }
  @media (max-width:480px) {
    .app { padding: 18px 10px 35px; }
    h1 { font-size:28px; }
    .item { gap:4px; padding-left:4px; padding-right:4px; }
    .item-name { font-size:17px; }
    .move-up { flex-basis:34px; width:34px; height:34px; font-size:15px; }
    .controls { gap:3px; }
    .round { width:34px; height:34px; font-size:19px; }
  }
</style>
</head>
<body>
<div class="app">
  <div class="header-row">
    <h1>Kitchen Inventory</h1>
    <button class="sync-pill" id="syncPill" data-state="unconfigured" type="button">
      <span class="sync-dot"></span><span id="syncPillLabel">Set up sync</span>
    </button>
  </div>
  <div id="syncBanner"></div>
  <div class="tabs">
    <button class="tab active" data-tab="dinner"><span class="tab-icon">❄</span>Dinner Inventory</button>
    <button class="tab" data-tab="ingredients"><span class="tab-icon">❄</span>Ingredients</button>
    <button class="tab" data-tab="fridge">Fridge Inventory</button>
    <button class="tab" data-tab="pantry">Pantry Items</button>
  </div>
  <div id="content"></div>
</div>

<div class="modal-overlay hidden" id="syncModalOverlay">
  <div class="modal">
    <h2>Cloud Sync</h2>
    <p class="hint">Stores this inventory in a private GitHub repo so it syncs between your devices. Uses a fine-grained personal access token scoped to just that repo.</p>
    <div class="field">
      <label for="cfgOwner">GitHub username</label>
      <input id="cfgOwner" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="terisaphillips-star">
    </div>
    <div class="field">
      <label for="cfgRepo">Repository name</label>
      <input id="cfgRepo" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="kitchen-inventory-data">
    </div>
    <div class="field">
      <label for="cfgPath">File path</label>
      <input id="cfgPath" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="inventory.json">
    </div>
    <div class="field">
      <label for="cfgBranch">Branch</label>
      <input id="cfgBranch" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="main">
    </div>
    <div class="field">
      <label for="cfgToken">Access token</label>
      <input id="cfgToken" type="password" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="github_pat_…">
    </div>
    <div class="modal-status" id="cfgStatus"></div>
    <div class="modal-actions">
      <button class="btn-cancel" id="cfgCancel" type="button">Cancel</button>
      <button class="btn-save" id="cfgSave" type="button">Test &amp; Save</button>
    </div>
    <div class="modal-actions" id="cfgRemoveRow" style="display:none">
      <button class="btn-danger" id="cfgRemove" type="button">Remove sync from this device</button>
    </div>
    <div class="build-info" id="buildInfo"></div>
  </div>
</div>

<script>
// Bump alongside CACHE_NAME in service-worker.js on every deploy. Baked
// directly into this HTML so it reflects what actually got served, even
// if the service worker itself is stuck on something stale.
const APP_BUILD = "v9";

const initial = {
  dinner: {
    "Main Meal Portions": [
      ["Spicy Sausage",2],["Imitation Crab",1],["Wontons",1],["Rosee Sauce Base",3],
      ["Tofu",2],["Chicken Breasts",2],["Chicken Drumsticks",2],["Ground Pork",2],
      ["Ground Pork 1/2 portion",2],["Italian Wedding Soup",3],["Tilapia",1]
    ],
    "Sides": [["Broccoli",1],["Asian Veggies",1],["Corn",1]]
  },
  ingredients: {
    "Ingredients": [["Heavy Cream",3],["Burger Buns",1],["Crumbled Bacon",5],["Green Onions",4],["Pesto",4]]
  },
  fridge: {
    "Fridge Items": []
  },
  pantry: {
    "Pantry Items": []
  }
};

let data = JSON.parse(localStorage.getItem("kitchenInventoryV1") || "null") || JSON.parse(JSON.stringify(initial));
let history = JSON.parse(localStorage.getItem("kitchenInventoryHistoryV1") || "[]");
let tab = "dinner";
let collapsed = {};
// Declared here (not as `const Sync = ...` further down) so that save()'s
// early unconditional call at startup, before the Sync module below has run,
// sees a plain null instead of throwing a temporal-dead-zone ReferenceError.
let Sync = null;
function purgeZeroItemsOnOpen() {
  Object.values(data).forEach(tabObj => Object.keys(tabObj).forEach(cat => {
    tabObj[cat] = tabObj[cat].filter(([name,q]) => q > 0);
  }));
}
// Backfills tabs added after a device's data was first created, so an
// existing install (real data already in localStorage, no fridge/pantry
// keys yet) doesn't throw when those tabs render.
function ensureTabsExist() {
  if (!data.fridge) data.fridge = { "Fridge Items": [] };
  if (!data.pantry) data.pantry = { "Pantry Items": [] };
}
ensureTabsExist();
purgeZeroItemsOnOpen();
save();


function save() {
  localStorage.setItem("kitchenInventoryV1", JSON.stringify(data));
  localStorage.setItem("kitchenInventoryHistoryV1", JSON.stringify(history));
  if (Sync) Sync.onLocalChange();
}

function allPrevious(category) {
  const names = new Set(history.filter(x => x.category === category).map(x => x.name));
  Object.values(data).forEach(tabObj => Object.entries(tabObj).forEach(([cat, items]) => {
    if (cat === category) items.forEach(([name]) => names.add(name));
  }));
  return [...names];
}

function recordHistory(category, name) {
  history = [{category,name}, ...history.filter(x => !(x.category===category && x.name===name))].slice(0,100);
}

function totalDinner() {
  // Defensive: a hand-edited sync file could be missing this category entirely.
  const items = (data.dinner && data.dinner["Main Meal Portions"]) || [];
  return items.reduce((sum, [,q]) => sum + q, 0);
}

function weeks() {
  return totalDinner() / 5.5;
}

function render() {
  const root = document.getElementById("content");
  root.innerHTML = "";
  if (tab === "dinner") {
    const s = document.createElement("div");
    s.className = "summary";
    s.innerHTML = `<div class="summary-title">Main Meal Portions</div>
      <div class="summary-main">${totalDinner()} dinner portions</div>
      <div class="summary-sub">≈ ${weeks().toFixed(1)} weeks of dinners</div>`;
    root.appendChild(s);
  }
  Object.entries(data[tab] || {}).forEach(([category, items]) => root.appendChild(categoryEl(category, items)));
}


function categoryEl(category, items) {
  const wrap = document.createElement("section");
  wrap.className = "category";
  const head = document.createElement("div");
  head.className = "category-head";
  const h2 = document.createElement("h2");
  h2.textContent = category.toUpperCase();
  const chev = document.createElement("span");
  chev.className = "chevron";
  chev.textContent = collapsed[category] ? "▸" : "▾";
  head.append(h2, chev);
  head.onclick = () => { collapsed[category] = !collapsed[category]; render(); };
  wrap.appendChild(head);
  if (collapsed[category]) return wrap;

  if (tab === "dinner" && category === "Sides") {
    const sideTotal = items.reduce((sum, [,q]) => sum + q, 0);
    const sideSummary = document.createElement("div");
    sideSummary.className = "summary";
    sideSummary.style.marginTop = "10px";
    sideSummary.innerHTML = `<div class="summary-title">Side Portions</div>
      <div class="summary-main">${sideTotal} side portions</div>
      <div class="summary-sub">≈ ${(sideTotal/5.5).toFixed(1)} weeks of sides</div>`;
    wrap.appendChild(sideSummary);
  }

  if (!items.length) {
    const e = document.createElement("div"); e.className="empty"; e.textContent="No items";
    wrap.appendChild(e);
  }

  items.forEach(([name,q], idx) => {
    const row = document.createElement("div");
    row.className="item";
    row.dataset.index = idx;
    row.dataset.category = category;

    const up = document.createElement("button");
    up.className="move-up";
    up.textContent="▲";
    up.setAttribute("aria-label","Move up");
    up.disabled = idx === 0;
    up.onclick = (e) => { e.stopPropagation(); moveUp(category, idx); };

    const nm = document.createElement("div");
    nm.className="item-name";
    nm.textContent=name;

    const controls = document.createElement("div");
    controls.className="controls";

    const minus = document.createElement("button");
    minus.className="round";
    minus.textContent="−";
    minus.setAttribute("aria-label","Decrease");
    minus.disabled = q <= 0;

    const qty = document.createElement("div");
    qty.className="qty";
    qty.textContent=q;

    const plus = document.createElement("button");
    plus.className="round";
    plus.textContent="+";
    plus.setAttribute("aria-label","Increase");

    minus.onclick = (e) => { e.stopPropagation(); change(category, idx, -1); };
    plus.onclick = (e) => { e.stopPropagation(); change(category, idx, 1); };

    controls.append(minus,qty,plus);
    row.append(up,nm,controls);
    wrap.appendChild(row);
  });

  const addBtn = document.createElement("button");
  addBtn.className="add-btn";
  addBtn.textContent="+ Add Item";
  const panel = addPanel(category);
  addBtn.onclick = () => {
    panel.classList.toggle("open");
    if(panel.classList.contains("open")) panel.querySelector(".search").focus();
  };
  wrap.append(addBtn,panel);
  return wrap;
}

// Touching down to stop a momentum-scroll can land on a +/- button and
// register as a tap. Ignore taps that land within this long of the last
// scroll event, so stopping a scroll doesn't also nudge a quantity.
const SCROLL_TAP_GUARD_MS = 350;
let lastScrollAt = 0;
window.addEventListener("scroll", () => { lastScrollAt = Date.now(); }, { passive: true });
function recentlyScrolled() {
  return Date.now() - lastScrollAt < SCROLL_TAP_GUARD_MS;
}

// A short synthesized tick on +/- taps, since iOS Safari doesn't implement
// the Vibration API at all (a platform limitation, not fixable from here) —
// sound is the only real-time feedback channel available on iPhone.
let audioCtx = null;
function playTick(delta) {
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === "suspended") audioCtx.resume();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.frequency.value = delta > 0 ? 880 : 660;
    gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.045);
    osc.connect(gain).connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + 0.045);
  } catch (e) {}
  if (navigator.vibrate) navigator.vibrate(10); // no-op on iOS Safari; best-effort elsewhere
}

function moveUp(category, idx) {
  if (recentlyScrolled()) return;
  const arr = data[tab][category];
  if (idx <= 0 || idx >= arr.length) return;
  [arr[idx-1], arr[idx]] = [arr[idx], arr[idx-1]];
  save();
  render();
}

function change(category, idx, delta) {
  if (recentlyScrolled()) return;
  const arr = data[tab][category];
  if (!arr[idx]) return;
  arr[idx][1] = Math.max(0, arr[idx][1] + delta);
  playTick(delta);
  save();
  render();
}

function addPanel(category) {
  const p=document.createElement("div");
  p.className="add-panel";
  p.innerHTML=`<input class="search" placeholder="Search or type item…" autocomplete="off">
    <div class="suggestions"></div>
    <div class="quantity-row">
      <div><div class="new-label">Quantity</div><input class="search q-input" style="width:90px" type="number" min="1" value="1"></div>
      <button class="add-action">Add</button>
    </div>`;

  const search=p.querySelector(".search");
  const suggestions=p.querySelector(".suggestions");
  const qInput=p.querySelector(".q-input");

  function updateSuggestions(){
    const term=search.value.trim().toLowerCase();
    const list=allPrevious(category)
      .filter(n => !term || n.toLowerCase().includes(term))
      .slice(0,12);
    suggestions.innerHTML="";
    list.forEach(n=>{
      const b=document.createElement("button");
      b.className="suggestion";
      b.textContent=n;
      b.onclick=()=>{
        search.value=n;
        suggestions.innerHTML="";
        search.focus();
      };
      suggestions.appendChild(b);
    });
  }

  search.oninput=updateSuggestions;
  search.onfocus=updateSuggestions;

  p.querySelector(".add-action").onclick=()=>{
    const name=search.value.trim();
    const qty=Math.max(1,parseInt(qInput.value||"1",10));
    if(!name) return;

    const arr=data[tab][category];
    const existing=arr.findIndex(x=>x[0].toLowerCase()===name.toLowerCase());
    if(existing>=0) arr[existing][1]+=qty;
    else arr.push([name,qty]);

    recordHistory(category,name);
    save();
    render();
  };
  return p;
}

/* =====================================================================
   Cloud sync — a private GitHub repo holding one hand-editable JSON file.
   Self-contained: the rest of the app only ever calls Sync.onLocalChange()
   (from save()) and Sync.init() (once, at the bottom of this script).
   ===================================================================== */
Sync = (function () {
  const CONFIG_KEY = "kiSyncConfig";
  const SHA_KEY = "kiSyncSha";
  const BASE_KEY = "kiSyncBase";
  const LAST_KEY = "kiSyncLastAt";
  const API = "https://api.github.com";
  const PUSH_DEBOUNCE_MS = 2000;
  const PUSH_MAX_WAIT_MS = 15000;

  let cfg = null;              // {owner, repo, path, branch, token, device}
  let sha = null;               // blob sha of the version this device last saw
  let base = null;              // canonical string as of the last successful sync
  let lastSyncedAt = null;
  let state = "unconfigured";   // unconfigured | synced | syncing | offline | conflict | error
  let lastError = "";
  let lastErrorStatus = null;
  let conflictRemote = null;    // { sha, text, parsed } while state === conflict/error(bad remote)
  let conflictKind = "update";  // "update" (ongoing divergence) | "setup" (first connect, both sides have data)
  let remoteReadError = null;   // message shown above the conflict/error banner priority
  let pendingRemoteDoc = null;  // a pull that arrived while the user was mid-edit

  let pushTimer = null;
  let pushFirstQueuedAt = null;
  let pushInFlight = false;
  let pendingPushAfterInFlight = false;
  let pullInFlight = false;

  // ---------- small helpers ----------

  function guessDeviceName() {
    const ua = navigator.userAgent || "";
    if (/iPhone/.test(ua)) return "iPhone";
    if (/iPad/.test(ua)) return "iPad";
    if (/Android/.test(ua)) return "Android";
    if (/Macintosh/.test(ua)) return "Mac";
    if (/Windows/.test(ua)) return "Windows PC";
    return "device";
  }

  function relTime(ts) {
    const s = Math.round((Date.now() - ts) / 1000);
    if (s < 10) return "just now";
    if (s < 60) return s + "s ago";
    const m = Math.round(s / 60);
    if (m < 60) return m + "m ago";
    const h = Math.round(m / 60);
    if (h < 24) return h + "h ago";
    return Math.round(h / 24) + "d ago";
  }

  function userIsEditing() {
    const a = document.activeElement;
    if (!a) return false;
    if (a.tagName === "INPUT" || a.tagName === "TEXTAREA") return true;
    return !!(a.closest && a.closest(".add-panel.open"));
  }

  // ---------- UTF-8 safe base64 (GitHub's Contents API is base64 both ways) ----------

  function b64encode(str) {
    const bytes = new TextEncoder().encode(str);
    let binary = "";
    const chunk = 0x8000;
    for (let i = 0; i < bytes.length; i += chunk) {
      binary += String.fromCharCode.apply(null, bytes.subarray(i, i + chunk));
    }
    return btoa(binary);
  }

  function b64decode(b64) {
    const binary = atob(String(b64).replace(/\s/g, "")); // GitHub wraps content at ~60 chars
    const bytes = new Uint8Array(binary.length);
    for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
    return new TextDecoder().decode(bytes);
  }

  // ---------- serialization: one item per line, so diffs stay readable ----------

  function stringifyDoc(doc) {
    const q = JSON.stringify;
    const L = [];
    L.push("{");
    L.push(`  "schema": ${doc.schema},`);
    L.push(`  "updatedAt": ${q(doc.updatedAt)},`);
    L.push(`  "updatedBy": ${q(doc.updatedBy)},`);
    L.push(`  "data": {`);
    const tabKeys = Object.keys(doc.data);
    tabKeys.forEach((tabKey, ti) => {
      L.push(`    ${q(tabKey)}: {`);
      const catKeys = Object.keys(doc.data[tabKey]);
      catKeys.forEach((catKey, ci) => {
        const items = doc.data[tabKey][catKey];
        const catTail = ci < catKeys.length - 1 ? "," : "";
        if (!items.length) { L.push(`      ${q(catKey)}: []${catTail}`); return; }
        L.push(`      ${q(catKey)}: [`);
        items.forEach((item, ii) => {
          L.push(`        ${q(item)}${ii < items.length - 1 ? "," : ""}`);
        });
        L.push(`      ]${catTail}`);
      });
      L.push(`    }${ti < tabKeys.length - 1 ? "," : ""}`);
    });
    L.push(`  },`);
    L.push(`  "history": ${q(doc.history)}`);
    L.push("}");
    return L.join("\n") + "\n";
  }

  // Lenient on read, strict on write. Never throws; never partially applies —
  // returns {ok:false, error} and the caller leaves local data untouched.
  function parseDoc(text) {
    let obj;
    try { obj = JSON.parse(text); }
    catch (e) { return { ok: false, error: "The file isn't valid JSON — " + e.message }; }
    try {
      if (!obj || typeof obj !== "object" || !obj.data || typeof obj.data !== "object") {
        throw new Error('The file is missing the expected "data" object.');
      }
      const cleanData = {};
      for (const tabKey of Object.keys(obj.data)) {
        const tabObj = obj.data[tabKey];
        if (!tabObj || typeof tabObj !== "object") {
          throw new Error(`"${tabKey}" should be an object of categories.`);
        }
        cleanData[tabKey] = {};
        for (const catKey of Object.keys(tabObj)) {
          const items = tabObj[catKey];
          if (!Array.isArray(items)) throw new Error(`"${catKey}" should be a list of items.`);
          cleanData[tabKey][catKey] = items.map((it) => {
            if (!Array.isArray(it) || typeof it[0] !== "string") {
              throw new Error(`Bad item in "${catKey}" — expected ["Name", quantity].`);
            }
            const qty = Math.max(0, Math.round(Number(it[1]) || 0));
            return [it[0], qty];
          });
        }
      }
      // Defensive: keep the two tabs and the one hard-coded category the rest
      // of the app depends on (totalDinner()/render()) always present, even
      // if a hand-edit removed them.
      if (!cleanData.dinner) cleanData.dinner = {};
      if (!cleanData.dinner["Main Meal Portions"]) cleanData.dinner["Main Meal Portions"] = [];
      if (!cleanData.ingredients) cleanData.ingredients = {};
      if (!cleanData.fridge) cleanData.fridge = { "Fridge Items": [] };
      if (!cleanData.pantry) cleanData.pantry = { "Pantry Items": [] };

      let cleanHistory = [];
      if (Array.isArray(obj.history)) {
        cleanHistory = obj.history
          .filter((h) => h && typeof h.category === "string" && typeof h.name === "string")
          .map((h) => ({ category: h.category, name: h.name }));
      }
      return { ok: true, doc: { data: cleanData, history: cleanHistory } };
    } catch (e) {
      return { ok: false, error: e.message };
    }
  }

  function canonical() {
    return JSON.stringify({ data, history });
  }

  // True only for a device that has never been used — its data is still
  // exactly the seeded default. Safe to silently adopt a remote file in
  // that case; anything else means the user has real data worth protecting.
  function isUntouchedDefault() {
    return canonical() === JSON.stringify({ data: initial, history: [] });
  }

  function isDirty() {
    return base === null || canonical() !== base;
  }

  function isConfigured() {
    return !!(cfg && cfg.owner && cfg.repo && cfg.token);
  }

  // ---------- persistence of sync bookkeeping (separate from the app's own keys) ----------

  function loadConfig() {
    try { return JSON.parse(localStorage.getItem(CONFIG_KEY) || "null"); }
    catch { return null; }
  }
  function saveConfig(c) { localStorage.setItem(CONFIG_KEY, JSON.stringify(c)); }
  function clearConfig() {
    localStorage.removeItem(CONFIG_KEY);
    localStorage.removeItem(SHA_KEY);
    localStorage.removeItem(BASE_KEY);
    localStorage.removeItem(LAST_KEY);
  }
  function persist() {
    if (sha) localStorage.setItem(SHA_KEY, sha); else localStorage.removeItem(SHA_KEY);
    if (base !== null) localStorage.setItem(BASE_KEY, base); else localStorage.removeItem(BASE_KEY);
    if (lastSyncedAt) localStorage.setItem(LAST_KEY, String(lastSyncedAt)); else localStorage.removeItem(LAST_KEY);
  }
  // Writes the app's own two localStorage keys WITHOUT going through save(),
  // so adopting a remote doc can't turn around and push itself right back.
  function persistLocalDataOnly() {
    localStorage.setItem("kitchenInventoryV1", JSON.stringify(data));
    localStorage.setItem("kitchenInventoryHistoryV1", JSON.stringify(history));
  }

  // ---------- GitHub Contents API ----------

  function apiHeaders() {
    return {
      "Authorization": "Bearer " + cfg.token,
      "Accept": "application/vnd.github+json",
      "X-GitHub-Api-Version": "2022-11-28"
    };
  }
  function contentsUrl() {
    const pathParts = cfg.path.split("/").map(encodeURIComponent).join("/");
    return `${API}/repos/${encodeURIComponent(cfg.owner)}/${encodeURIComponent(cfg.repo)}/contents/${pathParts}`;
  }
  // Distinguishes a real GitHub API error (has .status, e.g. from a failed
  // fetchRemote()) from a plain network failure — a bad/expired token should
  // read as "needs setup", not "offline — will retry on its own", since retrying
  // alone will never fix it.
  function classifyFetchError(e) {
    if (e && e.status === 401) setState("error", "The GitHub token was rejected — it may be wrong or expired.", 401);
    else if (e && e.status === 403) setState("error", e.message || "Access denied by GitHub.", 403);
    else setState("offline");
  }
  async function apiError(res) {
    let msg = `GitHub API error (${res.status})`;
    try { const j = await res.json(); if (j && j.message) msg += ": " + j.message; } catch {}
    const err = new Error(msg);
    err.status = res.status;
    return err;
  }
  async function fetchRemote() {
    const url = `${contentsUrl()}?ref=${encodeURIComponent(cfg.branch)}&_=${Date.now()}`;
    const res = await fetch(url, { headers: apiHeaders(), cache: "no-store" });
    if (res.status === 404) return { exists: false };
    if (!res.ok) throw await apiError(res);
    const json = await res.json();
    return { exists: true, sha: json.sha, text: b64decode(json.content || "") };
  }
  function putRemote(text, shaForUpdate, message) {
    const body = { message, content: b64encode(text), branch: cfg.branch };
    if (shaForUpdate) body.sha = shaForUpdate;
    return fetch(contentsUrl(), {
      method: "PUT",
      headers: Object.assign({ "Content-Type": "application/json" }, apiHeaders()),
      body: JSON.stringify(body)
    });
  }

  // ---------- state + UI ----------

  function setState(s, detail, status) {
    state = s;
    lastError = detail || "";
    lastErrorStatus = status || null;
    refreshUI();
  }
  function refreshUI() { renderPill(); renderBanner(); }

  function renderPill() {
    const pill = document.getElementById("syncPill");
    const label = document.getElementById("syncPillLabel");
    if (!pill || !label) return;
    pill.dataset.state = state;
    let text;
    switch (state) {
      case "unconfigured": text = "Set up sync"; break;
      case "synced": text = "Synced" + (lastSyncedAt ? " " + relTime(lastSyncedAt) : ""); break;
      case "syncing": text = "Syncing…"; break;
      case "offline": text = isDirty() ? "Offline — will sync" : "Offline"; break;
      case "conflict": text = "Conflict"; break;
      case "error": text = (lastErrorStatus === 401 || lastErrorStatus === 403) ? "Needs setup" : "Sync error"; break;
      default: text = state;
    }
    label.textContent = text;
  }

  function renderBanner() {
    const el = document.getElementById("syncBanner");
    if (!el) return;
    el.innerHTML = "";

    if (remoteReadError) {
      const b = document.createElement("div");
      b.className = "banner error";
      const t = document.createElement("div"); t.className = "banner-title"; t.textContent = "Cloud file couldn't be read";
      const p = document.createElement("div"); p.textContent = "Your data on this device is safe. " + remoteReadError;
      const actions = document.createElement("div"); actions.className = "banner-actions";
      const overwrite = document.createElement("button"); overwrite.textContent = "Overwrite cloud with this device";
      overwrite.onclick = () => {
        const shaToUse = conflictRemote ? conflictRemote.sha : sha;
        remoteReadError = null; conflictRemote = null;
        push({ force: true, overrideSha: shaToUse });
      };
      const dismiss = document.createElement("button"); dismiss.textContent = "Dismiss";
      dismiss.onclick = () => { remoteReadError = null; refreshUI(); };
      actions.append(overwrite, dismiss);
      b.append(t, p, actions);
      el.appendChild(b);
      return;
    }

    if (state === "conflict" && conflictRemote) {
      const b = document.createElement("div");
      b.className = "banner";
      const t = document.createElement("div"); t.className = "banner-title";
      t.textContent = conflictKind === "setup"
        ? "This device already has its own data"
        : "This device and the cloud have both changed";
      const p = document.createElement("div");
      p.textContent = conflictKind === "setup"
        ? "The cloud file has different data too. Pick which one this device should keep using."
        : "Either way, the other version stays recoverable in the repo's history.";
      const actions = document.createElement("div"); actions.className = "banner-actions";
      const keep = document.createElement("button"); keep.className = "primary"; keep.textContent = "Keep this device";
      keep.onclick = resolveKeepLocal;
      const cloud = document.createElement("button"); cloud.textContent = "Use cloud version";
      cloud.onclick = resolveUseCloud;
      actions.append(keep, cloud);
      b.append(t, p, actions);
      el.appendChild(b);
      return;
    }

    if (state === "error" && lastError) {
      const b = document.createElement("div");
      b.className = "banner error";
      const t = document.createElement("div"); t.className = "banner-title"; t.textContent = "Sync problem";
      const p = document.createElement("div"); p.textContent = lastError;
      const actions = document.createElement("div"); actions.className = "banner-actions";
      const openSettings = document.createElement("button"); openSettings.textContent = "Open sync settings";
      openSettings.onclick = openModal;
      actions.append(openSettings);
      b.append(t, p, actions);
      el.appendChild(b);
    }
  }

  // ---------- push ----------

  function scheduleDebouncedPush() {
    if (!pushFirstQueuedAt) pushFirstQueuedAt = Date.now();
    if (Date.now() - pushFirstQueuedAt >= PUSH_MAX_WAIT_MS) {
      if (pushTimer) { clearTimeout(pushTimer); pushTimer = null; }
      push();
      return;
    }
    if (pushTimer) clearTimeout(pushTimer);
    pushTimer = setTimeout(() => { pushTimer = null; push(); }, PUSH_DEBOUNCE_MS);
  }
  function flushPushNow() {
    if (pushTimer) { clearTimeout(pushTimer); pushTimer = null; }
    if (isConfigured() && isDirty() && state !== "conflict") push();
  }

  async function push(opts) {
    opts = opts || {};
    pushFirstQueuedAt = null;
    if (!isConfigured()) return;
    if (pushInFlight) { pendingPushAfterInFlight = true; return; }
    if (!opts.force && !isDirty()) return;

    pushInFlight = true;
    setState("syncing");
    const deviceName = cfg.device || guessDeviceName();
    const doc = { schema: 1, updatedAt: new Date().toISOString(), updatedBy: deviceName, data, history };
    const text = stringifyDoc(doc);
    const shaToUse = "overrideSha" in opts ? opts.overrideSha : sha;

    try {
      const res = await putRemote(text, shaToUse, `Update inventory from ${deviceName}`);
      if (res.status === 200 || res.status === 201) {
        const json = await res.json();
        sha = json.content.sha;
        base = canonical();
        lastSyncedAt = Date.now();
        remoteReadError = null;
        conflictRemote = null;
        persist();
        setState("synced");
      } else if (res.status === 409 || res.status === 422) {
        await handleConflict();
      } else if (res.status === 401) {
        setState("error", "The GitHub token was rejected — it may be wrong or expired.", 401);
      } else if (res.status === 403) {
        const err = await apiError(res);
        setState("error", err.message, 403);
      } else if (res.status === 404) {
        setState("error", "GitHub couldn't find that repo or file path — check sync settings.", 404);
      } else {
        const err = await apiError(res);
        setState("error", err.message, res.status);
      }
    } catch (e) {
      setState("offline");
    } finally {
      pushInFlight = false;
      if (pendingPushAfterInFlight) { pendingPushAfterInFlight = false; scheduleDebouncedPush(); }
    }
  }

  async function handleConflict() {
    try {
      const remote = await fetchRemote();
      if (!remote.exists) {
        sha = null;
        setState("error", "The file on GitHub seems to have been removed since the last sync.", 404);
        return;
      }
      const parsed = parseDoc(remote.text);
      conflictRemote = { sha: remote.sha, text: remote.text, parsed };
      conflictKind = "update";
      if (!parsed.ok) {
        remoteReadError = parsed.error + " Fix the file, or overwrite the cloud with this device's copy.";
        setState("error", "Cloud file has invalid data.");
      } else {
        setState("conflict");
      }
    } catch (e) {
      classifyFetchError(e);
    }
  }

  function resolveKeepLocal() {
    if (!conflictRemote) return;
    conflictKind = "update";
    push({ force: true, overrideSha: conflictRemote.sha });
  }
  function resolveUseCloud() {
    if (!conflictRemote || !conflictRemote.parsed || !conflictRemote.parsed.ok) return;
    data = conflictRemote.parsed.doc.data;
    history = conflictRemote.parsed.doc.history;
    sha = conflictRemote.sha;
    base = canonical();
    lastSyncedAt = Date.now();
    conflictRemote = null;
    conflictKind = "update";
    remoteReadError = null;
    persist();
    persistLocalDataOnly();
    render();
    setState("synced");
  }

  // ---------- pull ----------

  function adoptRemote(remote) {
    const parsed = parseDoc(remote.text);
    if (!parsed.ok) {
      conflictRemote = { sha: remote.sha, text: remote.text, parsed };
      remoteReadError = parsed.error + " Fix the file, or overwrite the cloud with this device's copy.";
      setState("error", "Cloud file has invalid data.");
      return;
    }
    data = parsed.doc.data;
    history = parsed.doc.history;
    sha = remote.sha;
    base = canonical(); // set BEFORE persisting/rendering so nothing reads this as a new local change
    lastSyncedAt = Date.now();
    persist();
    persistLocalDataOnly();
    render();
    setState("synced");
  }

  async function pull() {
    if (!isConfigured() || pullInFlight) return;
    if (state === "conflict") return; // wait for the user to resolve it first
    pullInFlight = true;
    try {
      const remote = await fetchRemote();
      if (!remote.exists) {
        await push({ force: true }); // nothing published yet — bootstrap from this device
        return;
      }
      if (remote.sha === sha) {
        setState(isDirty() ? "offline" : "synced");
        if (isDirty()) scheduleDebouncedPush();
        return;
      }
      if (!isDirty()) {
        if (userIsEditing()) { pendingRemoteDoc = remote; return; }
        adoptRemote(remote);
        return;
      }
      const parsed = parseDoc(remote.text);
      conflictRemote = { sha: remote.sha, text: remote.text, parsed };
      if (!parsed.ok) {
        remoteReadError = parsed.error + " Fix the file, or overwrite the cloud with this device's copy.";
        setState("error", "Cloud file has invalid data.");
      } else {
        setState("conflict");
      }
    } catch (e) {
      classifyFetchError(e);
    } finally {
      pullInFlight = false;
    }
  }

  function onLocalChange() {
    if (!isConfigured()) return;
    if (state === "conflict") return; // don't push over an unresolved conflict
    if (!isDirty()) return;
    scheduleDebouncedPush();
  }

  document.addEventListener("focusout", () => {
    setTimeout(() => {
      if (pendingRemoteDoc && !userIsEditing()) {
        const doc = pendingRemoteDoc;
        pendingRemoteDoc = null;
        adoptRemote(doc);
      }
    }, 50);
  });

  // ---------- settings modal ----------

  function openModal() {
    const c = cfg || {};
    document.getElementById("cfgOwner").value = c.owner || "";
    document.getElementById("cfgRepo").value = c.repo || "";
    document.getElementById("cfgPath").value = c.path || "inventory.json";
    document.getElementById("cfgBranch").value = c.branch || "main";
    document.getElementById("cfgToken").value = c.token || "";
    const statusEl = document.getElementById("cfgStatus");
    statusEl.textContent = ""; statusEl.className = "modal-status";
    document.getElementById("cfgRemoveRow").style.display = isConfigured() ? "flex" : "none";
    const swState = navigator.serviceWorker && navigator.serviceWorker.controller ? "active" : "none";
    document.getElementById("buildInfo").textContent = `Build ${APP_BUILD} · service worker: ${swState}`;
    document.getElementById("syncModalOverlay").classList.remove("hidden");
  }
  function closeModal() { document.getElementById("syncModalOverlay").classList.add("hidden"); }

  async function onSaveConfig() {
    const owner = document.getElementById("cfgOwner").value.trim();
    const repo = document.getElementById("cfgRepo").value.trim();
    const path = document.getElementById("cfgPath").value.trim() || "inventory.json";
    const branch = document.getElementById("cfgBranch").value.trim() || "main";
    const token = document.getElementById("cfgToken").value.trim();
    const statusEl = document.getElementById("cfgStatus");

    if (!owner || !repo || !token) {
      statusEl.textContent = "Username, repo, and token are all required.";
      statusEl.className = "modal-status err";
      return;
    }

    statusEl.textContent = "Checking…";
    statusEl.className = "modal-status";
    const prevCfg = cfg;
    cfg = { owner, repo, path, branch, token, device: guessDeviceName() };

    try {
      const remote = await fetchRemote();
      saveConfig(cfg);

      let finalState = "synced";
      let finalDetail = "";
      if (!remote.exists) {
        sha = null; base = null; // dirty on purpose: this device's data becomes the first version
      } else {
        const parsed = parseDoc(remote.text);
        if (!parsed.ok) {
          sha = remote.sha; base = null;
          remoteReadError = parsed.error + " Fix the file, or overwrite the cloud with this device's copy.";
          finalState = "error"; finalDetail = "Cloud file has invalid data.";
        } else if (!isUntouchedDefault() &&
                   JSON.stringify({ data: parsed.doc.data, history: parsed.doc.history }) !== canonical()) {
          // This device already has real data that differs from the cloud —
          // don't silently overwrite it on connect. Same choice as an
          // ongoing conflict, just worded for first-time setup.
          sha = remote.sha; base = null;
          conflictRemote = { sha: remote.sha, text: remote.text, parsed };
          conflictKind = "setup";
          finalState = "conflict";
        } else {
          data = parsed.doc.data;
          history = parsed.doc.history;
          sha = remote.sha;
          base = canonical();
          persistLocalDataOnly();
          render();
          lastSyncedAt = Date.now();
        }
      }
      persist();

      statusEl.textContent = "Connected.";
      statusEl.className = "modal-status ok";
      setTimeout(() => {
        closeModal();
        if (!remote.exists) { setState("syncing"); push({ force: true }); }
        else setState(finalState, finalDetail);
      }, 500);
    } catch (e) {
      cfg = prevCfg;
      statusEl.textContent =
        e.status === 401 ? "That token was rejected — check it's correct and hasn't expired." :
        e.status === 403 ? "That token doesn't have write access to this repo's contents." :
        e.status === 404 ? "Couldn't find that repo (or the token can't see it)." :
        ("Couldn't connect: " + e.message);
      statusEl.className = "modal-status err";
    }
  }

  function onRemoveConfig() {
    clearConfig();
    cfg = null; sha = null; base = null; lastSyncedAt = null;
    conflictRemote = null; conflictKind = "update"; remoteReadError = null; pendingRemoteDoc = null;
    setState("unconfigured");
    closeModal();
  }

  function wireUI() {
    const pill = document.getElementById("syncPill");
    pill.onclick = () => {
      if (!isConfigured() || state === "conflict" || state === "error") { openModal(); return; }
      pull();
      flushPushNow();
    };
    const overlay = document.getElementById("syncModalOverlay");
    document.getElementById("cfgCancel").onclick = closeModal;
    document.getElementById("cfgSave").onclick = onSaveConfig;
    document.getElementById("cfgRemove").onclick = onRemoveConfig;
    overlay.addEventListener("click", (e) => { if (e.target === overlay) closeModal(); });
  }

  // ---------- boot ----------

  function init() {
    cfg = loadConfig();
    sha = localStorage.getItem(SHA_KEY) || null;
    base = localStorage.getItem(BASE_KEY);
    const lastAt = localStorage.getItem(LAST_KEY);
    lastSyncedAt = lastAt ? Number(lastAt) : null;

    wireUI();

    if (!isConfigured()) {
      setState("unconfigured");
    } else {
      setState(navigator.onLine === false ? "offline" : "syncing");
      pull();
    }

    window.addEventListener("online", () => { if (isConfigured()) { pull(); flushPushNow(); } });
    window.addEventListener("offline", () => { if (isConfigured() && state !== "conflict") setState("offline"); });
    document.addEventListener("visibilitychange", () => {
      if (document.visibilityState === "hidden") flushPushNow();
      else if (document.visibilityState === "visible" && isConfigured()) pull();
    });
  }

  return { init, onLocalChange };
})();

document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{
  tab=b.dataset.tab;
  document.querySelectorAll(".tab").forEach(x=>x.classList.toggle("active",x===b));
  render();
});

render();
if (Sync) Sync.init();

if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("service-worker.js").catch(err => {
      console.log("Service worker registration failed:", err);
    });
  });
}
</script>
</body>
</html>
