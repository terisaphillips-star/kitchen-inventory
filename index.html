<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111315">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Kitchen Inventory">
<title>Kitchen Inventory</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", sans-serif;
    background: #111315;
    color: #f2f3f5;
  }
  .app { max-width: 760px; margin: 0 auto; padding: 20px 16px 40px; }
  h1 { font-size: 30px; margin: 4px 0 16px; letter-spacing: -0.6px; }
  .tabs {
    display: flex; gap: 8px; margin-bottom: 18px;
    border-bottom: 1px solid #30343a; padding-bottom: 8px;
  }
  .tab {
    border: 0; background: transparent; padding: 10px 14px;
    border-radius: 10px; font-size: 16px; font-weight: 600; color: #a9afb8;
    cursor: pointer;
  }
  .tab.active { background: #2a2e34; color: #f5f6f7; }
  .summary {
    background: #1b1e22; border: 1px solid #30343a; border-radius: 16px;
    padding: 15px 16px; margin-bottom: 22px;
  }
  .summary-title { font-weight: 700; font-size: 16px; }
  .summary-main { font-size: 22px; font-weight: 700; margin-top: 3px; }
  .summary-sub { color: #a9afb8; margin-top: 2px; font-size: 14px; }
  .category { margin: 0 0 24px; }
  .category-head {
    display:flex; align-items:center; justify-content:space-between;
    padding: 5px 2px 9px; border-bottom: 1px solid #30343a; cursor: pointer;
  }
  .category-head h2 { font-size: 15px; margin:0; letter-spacing:.5px; }
  .chevron { color:#8f969f; font-size:16px; }
  .item {
    display:flex; align-items:center; gap:6px; min-height:40px;
    border-bottom:1px solid #30343a; padding:3px 6px;
    border-radius:7px;
  }
  .item:nth-of-type(even) { background:#181b1f; }
  .move-up {
    flex:0 0 36px; width:36px; height:36px; border-radius:10px; border:1px solid #4a5058;
    background:#24282e; color:#ffffff; font-size:16px; line-height:1; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    -webkit-tap-highlight-color: transparent;
  }
  .move-up:disabled { opacity:.35; cursor:default; }
  .move-up:active { transform: scale(.94); background:#343941; }
  .item-name { flex:1 1 auto; min-width:0; font-size:18px; line-height:1.25; overflow-wrap:anywhere; }
  .controls { display:flex; align-items:center; gap:4px; flex:0 0 auto; }
  .qty {
    min-width:24px; text-align:center; font-size:17px; font-weight:700;
    transition: transform .14s ease, background .14s ease;
    border-radius:8px; padding:3px 1px;
  }
  .qty.flash { transform: scale(1.28); background:#30343a; }
  button { font: inherit; }
  .round {
    width:36px; height:36px; border-radius:10px; border:1px solid #4a5058;
    background:#24282e; color:#ffffff; font-size:21px; line-height:1; cursor:pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .round:disabled { opacity:.35; cursor:default; }
  .round:active { transform: scale(.94); background:#343941; }
  .add-btn {
    width:100%; border:1px dashed #59616b; background:transparent; color:#d9dde2;
    border-radius:12px; padding:12px; margin-top:10px; font-size:16px;
    cursor:pointer;
  }
  .add-panel {
    display:none; background:#24282e; border:1px solid #ddd; border-radius:14px;
    padding:14px; margin-top:10px;
  }
  .add-panel.open { display:block; }
  .search {
    width:100%; border:1px solid #4b535d; border-radius:10px; padding:11px 12px;
    font-size:16px; outline:none; color:#f2f3f5; background:#24282e;
  }
  .suggestions { margin-top:8px; max-height:180px; overflow:auto; }
  .suggestion {
    width:100%; text-align:left; border:0; background:#292d33; color:#f0f2f4; margin:4px 0;
    border-radius:9px; padding:10px; cursor:pointer;
  }
  .new-item-row { margin-top:12px; }
  .new-label { font-size:13px; color:#a9afb8; margin-bottom:5px; }
  .quantity-row { display:flex; align-items:center; justify-content:space-between; margin-top:12px; }
  .add-action {
    border:0; border-radius:10px; background:#e7e9ec; color:#15171a;
    padding:11px 16px; cursor:pointer; font-weight:700;
  }
  .empty { color:#8f969f; font-size:14px; padding:14px 2px 0; }
  .hidden { display:none; }
  @media (max-width:480px) {
    .app { padding: 18px 10px 35px; }
    h1 { font-size:28px; }
    .item { gap:4px; padding-left:4px; padding-right:4px; }
    .item-name { font-size:17px; }
    .move-up { flex-basis:34px; width:34px; height:34px; font-size:15px; }
    .controls { gap:3px; }
    .round { width:34px; height:34px; font-size:19px; }
  }
</style>
</head>
<body>
<div class="app">
  <h1>Kitchen Inventory</h1>
  <div class="tabs">
    <button class="tab active" data-tab="dinner">Dinner Inventory</button>
    <button class="tab" data-tab="ingredients">Ingredients</button>
  </div>
  <div id="content"></div>
</div>

<script>
const initial = {
  dinner: {
    "Main Meal Portions": [
      ["Spicy Sausage",2],["Imitation Crab",1],["Wontons",1],["Rosee Sauce Base",3],
      ["Tofu",2],["Chicken Breasts",2],["Chicken Drumsticks",2],["Ground Pork",2],
      ["Ground Pork 1/2 portion",2],["Italian Wedding Soup",3],["Tilapia",1]
    ],
    "Sides": [["Broccoli",1],["Asian Veggies",1],["Corn",1]]
  },
  ingredients: {
    "Ingredients": [["Heavy Cream",3],["Burger Buns",1],["Crumbled Bacon",5],["Green Onions",4],["Pesto",4]]
  }
};

let data = JSON.parse(localStorage.getItem("kitchenInventoryV1") || "null") || initial;
let history = JSON.parse(localStorage.getItem("kitchenInventoryHistoryV1") || "[]");
let tab = "dinner";
let collapsed = {};
function purgeZeroItemsOnOpen() {
  Object.values(data).forEach(tabObj => Object.keys(tabObj).forEach(cat => {
    tabObj[cat] = tabObj[cat].filter(([name,q]) => q > 0);
  }));
}
purgeZeroItemsOnOpen();
save();


function save() {
  localStorage.setItem("kitchenInventoryV1", JSON.stringify(data));
  localStorage.setItem("kitchenInventoryHistoryV1", JSON.stringify(history));
}

function allPrevious(category) {
  const names = new Set(history.filter(x => x.category === category).map(x => x.name));
  Object.values(data).forEach(tabObj => Object.entries(tabObj).forEach(([cat, items]) => {
    if (cat === category) items.forEach(([name]) => names.add(name));
  }));
  return [...names];
}

function recordHistory(category, name) {
  history = [{category,name}, ...history.filter(x => !(x.category===category && x.name===name))].slice(0,100);
}

function totalDinner() {
  return data.dinner["Main Meal Portions"].reduce((sum, [,q]) => sum + q, 0);
}

function weeks() {
  return totalDinner() / 5.5;
}

function render() {
  const root = document.getElementById("content");
  root.innerHTML = "";
  if (tab === "dinner") {
    const s = document.createElement("div");
    s.className = "summary";
    s.innerHTML = `<div class="summary-title">Main Meal Portions</div>
      <div class="summary-main">${totalDinner()} dinner portions</div>
      <div class="summary-sub">≈ ${weeks().toFixed(1)} weeks of dinners</div>`;
    root.appendChild(s);
  }
  Object.entries(data[tab]).forEach(([category, items]) => root.appendChild(categoryEl(category, items)));
}


function categoryEl(category, items) {
  const wrap = document.createElement("section");
  wrap.className = "category";
  const head = document.createElement("div");
  head.className = "category-head";
  head.innerHTML = `<h2>${category.toUpperCase()}</h2><span class="chevron">${collapsed[category] ? "▸" : "▾"}</span>`;
  head.onclick = () => { collapsed[category] = !collapsed[category]; render(); };
  wrap.appendChild(head);
  if (collapsed[category]) return wrap;

  if (tab === "dinner" && category === "Sides") {
    const sideTotal = items.reduce((sum, [,q]) => sum + q, 0);
    const sideSummary = document.createElement("div");
    sideSummary.className = "summary";
    sideSummary.style.marginTop = "10px";
    sideSummary.innerHTML = `<div class="summary-title">Side Portions</div>
      <div class="summary-main">${sideTotal} side portions</div>
      <div class="summary-sub">≈ ${(sideTotal/5.5).toFixed(1)} weeks of sides</div>`;
    wrap.appendChild(sideSummary);
  }

  if (!items.length) {
    const e = document.createElement("div"); e.className="empty"; e.textContent="No items";
    wrap.appendChild(e);
  }

  items.forEach(([name,q], idx) => {
    const row = document.createElement("div");
    row.className="item";
    row.dataset.index = idx;
    row.dataset.category = category;

    const up = document.createElement("button");
    up.className="move-up";
    up.textContent="▲";
    up.setAttribute("aria-label","Move up");
    up.disabled = idx === 0;
    up.onclick = (e) => { e.stopPropagation(); moveUp(category, idx); };

    const nm = document.createElement("div");
    nm.className="item-name";
    nm.textContent=name;

    const controls = document.createElement("div");
    controls.className="controls";

    const minus = document.createElement("button");
    minus.className="round";
    minus.textContent="−";
    minus.setAttribute("aria-label","Decrease");
    minus.disabled = q <= 0;

    const qty = document.createElement("div");
    qty.className="qty";
    qty.textContent=q;

    const plus = document.createElement("button");
    plus.className="round";
    plus.textContent="+";
    plus.setAttribute("aria-label","Increase");

    minus.onclick = (e) => { e.stopPropagation(); change(category, idx, -1); };
    plus.onclick = (e) => { e.stopPropagation(); change(category, idx, 1); };

    controls.append(minus,qty,plus);
    row.append(up,nm,controls);
    wrap.appendChild(row);
  });

  const addBtn = document.createElement("button");
  addBtn.className="add-btn";
  addBtn.textContent="+ Add Item";
  const panel = addPanel(category);
  addBtn.onclick = () => {
    panel.classList.toggle("open");
    if(panel.classList.contains("open")) panel.querySelector(".search").focus();
  };
  wrap.append(addBtn,panel);
  return wrap;
}

function moveUp(category, idx) {
  const arr = data[tab][category];
  if (idx <= 0 || idx >= arr.length) return;
  [arr[idx-1], arr[idx]] = [arr[idx], arr[idx-1]];
  save();
  render();
}

function change(category, idx, delta) {
  const arr = data[tab][category];
  if (!arr[idx]) return;
  arr[idx][1] = Math.max(0, arr[idx][1] + delta);
  save();
  render();
}

function addPanel(category) {
  const p=document.createElement("div");
  p.className="add-panel";
  p.innerHTML=`<input class="search" placeholder="Search or type item…" autocomplete="off">
    <div class="suggestions"></div>
    <div class="quantity-row">
      <div><div class="new-label">Quantity</div><input class="search q-input" style="width:90px" type="number" min="1" value="1"></div>
      <button class="add-action">Add</button>
    </div>`;

  const search=p.querySelector(".search");
  const suggestions=p.querySelector(".suggestions");
  const qInput=p.querySelector(".q-input");

  function updateSuggestions(){
    const term=search.value.trim().toLowerCase();
    const list=allPrevious(category)
      .filter(n => !term || n.toLowerCase().includes(term))
      .slice(0,12);
    suggestions.innerHTML="";
    list.forEach(n=>{
      const b=document.createElement("button");
      b.className="suggestion";
      b.textContent=n;
      b.onclick=()=>{
        search.value=n;
        suggestions.innerHTML="";
        search.focus();
      };
      suggestions.appendChild(b);
    });
  }

  search.oninput=updateSuggestions;
  search.onfocus=updateSuggestions;

  p.querySelector(".add-action").onclick=()=>{
    const name=search.value.trim();
    const qty=Math.max(1,parseInt(qInput.value||"1",10));
    if(!name) return;

    const arr=data[tab][category];
    const existing=arr.findIndex(x=>x[0].toLowerCase()===name.toLowerCase());
    if(existing>=0) arr[existing][1]+=qty;
    else arr.push([name,qty]);

    recordHistory(category,name);
    save();
    render();
  };
  return p;
}

document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{
  tab=b.dataset.tab;
  document.querySelectorAll(".tab").forEach(x=>x.classList.toggle("active",x===b));
  render();
});

render();

if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("service-worker.js").catch(err => {
      console.log("Service worker registration failed:", err);
    });
  });
}
</script>
</body>
</html>
